# Destination: .github/ISSUE_TEMPLATE/bug_report.yml
#
# This is a GitHub issue *form*, not a markdown template. Forms render as real
# input fields, can mark inputs required, and auto-apply labels — markdown
# templates just dump a skeleton into the box that reporters delete half of.
#
# Only four fields are required. Every required field is friction, and friction
# on a homebrew project means the report doesn't get filed at all.

name: Bug report
description: Something behaves incorrectly, crashes, or looks wrong
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Two quick notes before you start:

        - Some differences from real NES hardware are **deliberate** and already
          documented — see Known deviations in the README. Sprite flicker in busy
          scenes is the common one.
        - For anything audio, a recording is worth far more than a description.

  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - Super Mario Bros.
        - Donkey Kong
        - Other / a game I ported myself
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Build version
      description: >
        Shown on the bottom screen when the game boots, and in the debug overlay
        (press L) — for example `0247 RoseLemon 04b0f9ce`. It is also in the .nds
        filename. Please copy all of it: the number and codename come from the
        commit, so they identify exactly what you were running.

        A trailing `+` means the build had uncommitted changes — worth saying so,
        because that build does not correspond to anything I can check out.
      placeholder: "0247 RoseLemon 04b0f9ce"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Where did you run it?
      options:
        - Real DS hardware, DSpico flashcart
        - Real DS hardware, other flashcart
        - Emulator
    validations:
      required: true

  - type: input
    id: platform_detail
    attributes:
      label: Hardware or emulator details
      description: >
        For hardware: which DS model (Phat, Lite, DSi, 3DS) and which flashcart.
        For emulators: which one and what version.
      placeholder: "DS Lite + DSpico  —  or  —  melonDS 0.9.5"
    validations:
      required: true

  - type: dropdown
    id: game_mode
    attributes:
      label: Game mode
      options:
        - Arranged (playfield top, HUD on sub screen)
        - Original (whole frame on one screen)
        - Both
        - Not applicable / not sure
    validations:
      required: false

  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: What you actually saw or heard.
    validations:
      required: true

  - type: textarea
    id: what_expected
    attributes:
      label: What you expected instead
      description: >
        Often obvious, occasionally not — and when it isn't, this is the field that
        saves the most time.
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: >
        Be specific about *where* — world and level, or which screen. Getting to the
        right place is usually the slowest part of investigating.
      placeholder: |
        1. Start a new game
        2. Play to World 4-2
        3. Enter the second warp pipe
        4. Screen tears along the status bar split
    validations:
      required: false

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - Happened once, haven't reproduced it
    validations:
      required: false

  - type: dropdown
    id: reference_check
    attributes:
      label: Does the same thing happen on the original ROM in a NES emulator?
      description: >
        The single most useful thing you can tell me. If the original does it too,
        it's faithful behaviour and the report closes in a minute instead of an hour.
      options:
        - "No — the original behaves correctly"
        - "Yes — the original does this too"
        - "Haven't checked"
    validations:
      required: false

  - type: textarea
    id: media
    attributes:
      label: Screenshot, video or audio recording
      description: >
        Drag files in. For visual glitches a photo of the actual screen is fine and
        often better than a capture. For audio, please attach a recording rather than
        describing the sound — audio problems in this project are diagnosed by
        measurement, and a description can't be measured.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        Save file, ROM checksum (CRC32 or MD5 — don't attach the ROM itself),
        anything unusual about your setup.
    validations:
      required: false
